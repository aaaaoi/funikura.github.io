<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ガウディ・フニクラ模型シミュレーター</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      overflow: hidden;
      background-color: #121214;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      user-select: none;
      color: #e0e0e0;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
    }
    /* UIパネル (ガラスモルフィズムデザイン) */
    #ui-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(22, 22, 26, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      width: 320px;
      z-index: 10;
    }
    h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      color: #ffffff;
    }
    p.description {
      font-size: 0.8rem;
      color: #a0a0aa;
      line-height: 1.4;
      margin-bottom: 18px;
    }
    .slider-group {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }
    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: #ccc;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .slider-label span.val {
      color: #3b82f6;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #3b82f6;
      cursor: pointer;
    }
    .mode-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      width: 100%;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.05);
      color: #d0d0d5;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.2);
    }
    .btn-invert {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.3);
      color: #34d399;
    }
    .btn-invert:hover {
      background: rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }
    .btn-reset {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }
    .btn-reset:hover {
      background: rgba(239, 68, 68, 0.25);
      color: #fca5a5;
    }
    #status-box {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.8rem;
      color: #fbbf24;
      border-left: 3px solid #fbbf24;
      line-height: 1.4;
    }
    .legend {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.75rem;
      color: #888;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
  </style>

  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="ui-panel">
    <!-- <h1>FUNIKURA MODEL</h1> -->
    <p class="description">ガウディの逆さ吊り実験（フニクラ）シミュレーター</p>
    
    <div class="slider-group">
      <div class="slider-label">
        <span>🧵 紐のたるみ倍率</span>
        <span id="slack-val" class="val">1.3x</span>
      </div>
      <input type="range" id="slack-slider" min="1.0" max="2.5" step="0.1" value="1.3">
    </div>

    <div class="mode-group">
      <button id="btn-invert" class="btn btn-invert">
        <span>🔄</span> 上下反転（アーチ化）
      </button>
      <button id="btn-reset" class="btn btn-reset">
        <span>🗑️</span> クリア
      </button>
    </div>

    <div id="status-box">基点（オレンジの点）を選んで紐を張ってください。</div>
  </div>

  <div id="canvas-container"></div>

  <script>
    // --- 1. Scene & Renderer Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x121214);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 4, 30);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 4, 0);

    // ライティング
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 15);
    scene.add(dirLight);

    // --- 2. Model Structure ---
    const pivotGroup = new THREE.Group();
    scene.add(pivotGroup);

    const modelGroup = new THREE.Group();
    pivotGroup.add(modelGroup);

    // 天井フレーム (円環)
    const baseRadius = 8;
    const baseHeight = 12;
    const ringGeom = new THREE.TorusGeometry(baseRadius, 0.08, 16, 64);
    const ringMat = new THREE.MeshStandardMaterial({ color: 0x44444c, roughness: 0.5 });
    const ringMesh = new THREE.Mesh(ringGeom, ringMat);
    ringMesh.rotation.x = Math.PI / 2;
    ringMesh.position.y = baseHeight;
    modelGroup.add(ringMesh);

    // 天井の十字・放射ガイドフレーム
    const gridHelperGeom = new THREE.BufferGeometry();
    const gridMat = new THREE.LineBasicMaterial({ color: 0x33333b, transparent: true, opacity: 0.6 });
    const gridLines = [];
    
    for (let r of [0.35, 0.7]) {
      const radius = baseRadius * r;
      for (let i = 0; i < 32; i++) {
        const a1 = (i / 32) * Math.PI * 2;
        const a2 = ((i + 1) / 32) * Math.PI * 2;
        gridLines.push(Math.cos(a1) * radius, baseHeight, Math.sin(a1) * radius);
        gridLines.push(Math.cos(a2) * radius, baseHeight, Math.sin(a2) * radius);
      }
    }
    gridHelperGeom.setAttribute('position', new THREE.Float32BufferAttribute(gridLines, 3));
    modelGroup.add(new THREE.LineSegments(gridHelperGeom, gridMat));

    // --- 3. Physics & Node Engine ---
    const GRAVITY = -0.008;
    const ITERATIONS = 12;
    let nodes = [];
    let constraints = [];
    let selectedNodes = [];
    let isInverted = false;
    let hoveredNode = null;
    let slackFactor = 1.3; // 紐のたるみ倍率のデフォルト値

    const raycastTargets = [];
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function createNode(x, y, z, isFixed = false) {
      const node = {
        id: nodes.length,
        pos: new THREE.Vector3(x, y, z),
        oldPos: new THREE.Vector3(x, y, z),
        isFixed: isFixed,
        mass: 1.0,
        mesh: null,
        hitMesh: null
      };

      const geom = new THREE.SphereGeometry(isFixed ? 0.3 : 0.15, 16, 16);
      const color = isFixed ? 0xf97316 : 0x38bdf8;
      const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3 });
      const mesh = new THREE.Mesh(geom, mat);
      mesh.position.copy(node.pos);
      modelGroup.add(mesh);
      node.mesh = mesh;

      const hitGeom = new THREE.SphereGeometry(isFixed ? 0.6 : 0.4, 12, 12);
      const hitMat = new THREE.MeshBasicMaterial({ visible: false });
      const hitMesh = new THREE.Mesh(hitGeom, hitMat);
      hitMesh.position.copy(node.pos);
      hitMesh.userData = { node: node };
      modelGroup.add(hitMesh);
      node.hitMesh = hitMesh;

      nodes.push(node);
      raycastTargets.push(hitMesh);
      return node;
    }

    // 基点の配置
    createNode(0, baseHeight, 0, true);

    const innerDots = 6;
    for (let i = 0; i < innerDots; i++) {
      const angle = (i / innerDots) * Math.PI * 2;
      const r = baseRadius * 0.35;
      createNode(Math.cos(angle) * r, baseHeight, Math.sin(angle) * r, true);
    }

    const midDots = 12;
    for (let i = 0; i < midDots; i++) {
      const angle = (i / midDots) * Math.PI * 2 + (Math.PI / 12);
      const r = baseRadius * 0.7;
      createNode(Math.cos(angle) * r, baseHeight, Math.sin(angle) * r, true);
    }

    const numBaseDots = 16;
    for (let i = 0; i < numBaseDots; i++) {
      const angle = (i / numBaseDots) * Math.PI * 2;
      createNode(Math.cos(angle) * baseRadius, baseHeight, Math.sin(angle) * baseRadius, true);
    }

    const numFixedNodes = nodes.length;

    function createRope(nodeA, nodeB, segments = 10) {
      let prevNode = nodeA;
      // スライダーのたるみ倍率を紐の総延長に反映
      const straightDist = nodeA.pos.distanceTo(nodeB.pos);
      const segmentLength = (straightDist * slackFactor) / segments;

      for (let i = 1; i <= segments; i++) {
        let nextNode;

        if (i === segments) {
          nextNode = nodeB;
        } else {
          const pos = new THREE.Vector3().lerpVectors(nodeA.pos, nodeB.pos, i / segments);
          nextNode = createNode(pos.x, pos.y, pos.z, false);
        }

        constraints.push({ p1: prevNode, p2: nextNode, length: segmentLength });
        prevNode = nextNode;
      }
    }

    let ropeLines;
    function initRopeVisuals() {
      if (ropeLines) modelGroup.remove(ropeLines);
      const geom = new THREE.BufferGeometry();
      const mat = new THREE.LineBasicMaterial({ color: 0xeeeeee, linewidth: 2 });
      ropeLines = new THREE.LineSegments(geom, mat);
      modelGroup.add(ropeLines);
    }
    initRopeVisuals();

    function simulate() {
      if (isInverted) return;

      for (let node of nodes) {
        if (node.isFixed) continue;
        const vel = node.pos.clone().sub(node.oldPos).multiplyScalar(0.985);
        node.oldPos.copy(node.pos);
        node.pos.add(vel);
        node.pos.y += GRAVITY * node.mass;
      }

      for (let iter = 0; iter < ITERATIONS; iter++) {
        for (let c of constraints) {
          const dist = c.p1.pos.distanceTo(c.p2.pos);
          if (dist === 0) continue;
          const diff = (dist - c.length) / dist;
          const offset = c.p2.pos.clone().sub(c.p1.pos).multiplyScalar(0.5 * diff);

          if (!c.p1.isFixed) c.p1.pos.add(offset);
          if (!c.p2.isFixed) c.p2.pos.sub(offset);
        }
      }

      const positions = [];
      for (let node of nodes) {
        node.mesh.position.copy(node.pos);
        node.hitMesh.position.copy(node.pos);
      }
      for (let c of constraints) {
        positions.push(c.p1.pos.x, c.p1.pos.y, c.p1.pos.z);
        positions.push(c.p2.pos.x, c.p2.pos.y, c.p2.pos.z);
      }
      ropeLines.geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      ropeLines.geometry.attributes.position.needsUpdate = true;
    }

    // --- 4. Interactivity & Raycasting ---
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerdown', onPointerDown);

    function getIntersectedNode(e) {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(raycastTargets);
      if (intersects.length > 0) {
        return intersects[0].object.userData.node;
      }
      return null;
    }

    function onPointerMove(e) {
      if (e.clientX < 360 && e.clientY < 360) {
        document.body.style.cursor = 'default';
        return;
      }

      const node = getIntersectedNode(e);
      if (node !== hoveredNode) {
        if (hoveredNode && !selectedNodes.includes(hoveredNode)) {
          resetNodeColor(hoveredNode);
        }
        hoveredNode = node;
        if (hoveredNode) {
          document.body.style.cursor = 'pointer';
          if (!selectedNodes.includes(hoveredNode)) {
            hoveredNode.mesh.material.color.setHex(0xfacc15);
          }
        } else {
          document.body.style.cursor = 'default';
        }
      }
    }

    function onPointerDown(e) {
      if (e.clientX < 360 && e.clientY < 360) return;

      const node = getIntersectedNode(e);
      if (!node) return;

      handleRopeClick(node);
    }

    function handleRopeClick(node) {
      if (selectedNodes.includes(node)) {
        selectedNodes = [];
        resetNodeColor(node);
        updateStatus("選択を解除しました。1つ目の点を選んでください。");
        return;
      }

      selectedNodes.push(node);
      node.mesh.material.color.setHex(0xef4444);

      if (selectedNodes.length === 1) {
        updateStatus("2つ目の点を選んでください（同じ点でキャンセル）。");
      } else if (selectedNodes.length === 2) {
        createRope(selectedNodes[0], selectedNodes[1]);
        resetNodeColor(selectedNodes[0]);
        resetNodeColor(selectedNodes[1]);
        selectedNodes = [];
        updateStatus(`紐を張りました (たるみ倍率: ${slackFactor}x)。続けて別の点を選べます。`);
      }
    }

    function resetNodeColor(node) {
      if (!node) return;
      if (node.isFixed) {
        node.mesh.material.color.setHex(0xf97316);
      } else {
        node.mesh.material.color.setHex(0x38bdf8);
      }
    }

    // --- 5. UI Controller ---
    const btnInvert = document.getElementById('btn-invert');
    const btnReset = document.getElementById('btn-reset');
    const statusBox = document.getElementById('status-box');
    const slackSlider = document.getElementById('slack-slider');
    const slackVal = document.getElementById('slack-val');

    slackSlider.addEventListener('input', (e) => {
      slackFactor = parseFloat(e.target.value);
      slackVal.innerText = `${slackFactor.toFixed(1)}x`;
    });

    function updateStatus(msg) {
      statusBox.innerText = msg;
    }

    btnInvert.addEventListener('click', () => {
      isInverted = !isInverted;

      let minY = Infinity;
      let maxY = -Infinity;
      for (let n of nodes) {
        if (n.pos.y < minY) minY = n.pos.y;
        if (n.pos.y > maxY) maxY = n.pos.y;
      }
      const centerY = (minY + maxY) / 2;

      pivotGroup.position.set(0, centerY, 0);
      modelGroup.position.set(0, -centerY, 0);

      const targetRotation = isInverted ? Math.PI : 0;
      let startRot = pivotGroup.rotation.z;
      let startTime = performance.now();
      
      function animateInvert(now) {
        let elapsed = (now - startTime) / 1000;
        let progress = Math.min(elapsed / 0.8, 1.0);
        let ease = 0.5 - Math.cos(progress * Math.PI) / 2;
        
        pivotGroup.rotation.z = THREE.MathUtils.lerp(startRot, targetRotation, ease);

        if (progress < 1.0) {
          requestAnimationFrame(animateInvert);
        }
      }
      requestAnimationFrame(animateInvert);

      controls.target.set(0, centerY, 0);

      btnInvert.classList.toggle('active', isInverted);
      btnInvert.innerHTML = isInverted ? '<span>🔄</span> 元に戻す (吊り下げ)' : '<span>🔄</span> 上下反転（アーチ化）';
      updateStatus(isInverted ? "上下反転中: 画面中央にアーチが収まるよう調整されました。" : "吊り下げ状態に戻しました。");
    });

    btnReset.addEventListener('click', () => {
      for (let i = nodes.length - 1; i >= numFixedNodes; i--) {
        const n = nodes[i];
        modelGroup.remove(n.mesh);
        modelGroup.remove(n.hitMesh);
      }
      nodes = nodes.slice(0, numFixedNodes);
      raycastTargets.length = numFixedNodes;
      constraints = [];
      selectedNodes = [];
      initRopeVisuals();
      if (isInverted) btnInvert.click();
      
      pivotGroup.position.set(0, 0, 0);
      modelGroup.position.set(0, 0, 0);
      controls.target.set(0, 4, 0);

      updateStatus("リセットしました。基点を選んでスタートしてください。");
    });

    // --- 6. Render Loop & Resize ---
    function animate() {
      requestAnimationFrame(animate);
      simulate();
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
